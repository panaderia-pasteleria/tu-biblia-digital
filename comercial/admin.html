<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración | Tu Biblia Digital</title><style>body{background:#121313;color:#f4ecdd;font:16px system-ui;margin:0;padding:22px;display:grid;place-items:center;min-height:100vh}main{width:min(100%,550px);background:#1d1d1c;border:1px solid #4f483e;border-radius:18px;padding:25px;box-sizing:border-box}h1{font:32px Georgia,serif}p{line-height:1.55;color:#d9ccba}label{display:block;margin-top:18px}input,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #76634b;border-radius:8px;background:#111;color:#fff;font:inherit}textarea{height:125px}button{display:block;width:100%;margin:14px 0;padding:14px;background:#d8b67c;color:#17130b;border:0;border-radius:8px;font:inherit;font-weight:700}#codes article{border:1px solid #5f533f;border-radius:8px;padding:12px;margin:8px 0;overflow-wrap:anywhere}code{display:block;color:#e0c18c;font-size:12px;margin-top:7px}#status{min-height:20px}</style></head><body><main><h1>Códigos de regalo</h1><p>Panel privado del propietario. Los códigos son de uso único. Solo el administrador autorizado puede crearlos.</p><section><label for="email">Correo de administrador</label><input id="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com"><button id="login">Enviar enlace de acceso</button></section><section id="controls" hidden><label for="labels">Destinatarios (uno por línea; máximo 10)</label><textarea id="labels" placeholder="Papá&#10;Mamá&#10;Hermano"></textarea><button id="generate">Generar códigos</button><button id="logout">Cerrar sesión</button><div id="codes"></div></section><p id="status" role="status"></p><p style="font-size:12px">Copia y guarda los códigos al generarlos; por seguridad solo almacenamos su huella criptográfica y no es posible recuperar el texto original.</p></main><script src="./config.js"></script><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const cfg=window.TBD_CONFIG, $=id=>document.getElementById(id);
if(!cfg?.supabaseUrl||!cfg?.supabaseAnonKey||!cfg?.functionsUrl){$("status").textContent="Configuración pendiente."}else{
const db=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
const show=async()=>{const {data:{user}}=await db.auth.getUser();$("controls").hidden=!user;$("status").textContent=user?"Sesión iniciada. La emisión de códigos está restringida en el servidor.":"Inicia sesión para administrar.";};
$("login").onclick=async()=>{const email=$("email").value.trim();if(!$("email").checkValidity()||!email)return $("status").textContent="Correo no válido";const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split("?")[0]}});$("status").textContent=error?error.message:"Revisa tu correo para confirmar acceso.";};
$("generate").onclick=async()=>{const labels=$("labels").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!labels.length||labels.length>10)return $("status").textContent="Introduce entre 1 y 10 nombres.";const {data:{session}}=await db.auth.getSession();if(!session)return $("status").textContent="Sesión caducada.";const btn=$("generate");btn.disabled=true;try{const response=await fetch(cfg.functionsUrl+"/create-gift-codes",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token,apikey:cfg.supabaseAnonKey},body:JSON.stringify({labels})});if(!response.ok)throw Error(response.status===403?"Esta cuenta no tiene permisos de administrador.":"No se pudieron crear los códigos.");const data=await response.json();$("codes").replaceChildren();for(const item of data.codes){const box=document.createElement("article"),title=document.createElement("strong"),code=document.createElement("code"),copy=document.createElement("button");title.textContent=item.label;code.textContent=item.code;copy.textContent="Copiar código";copy.onclick=()=>navigator.clipboard?.writeText(item.code);box.append(title,code,copy);$("codes").append(box)}$("status").textContent="Códigos generados. Guárdalos en un lugar seguro.";}catch(e){$("status").textContent=e.message}finally{btn.disabled=false}};
$("logout").onclick=async()=>{await db.auth.signOut();await show()};db.auth.onAuthStateChange(()=>setTimeout(show,0));show();
}
</script></body></html>
