<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Lector protegido | Tu Biblia Digital</title>
<style>body{margin:0;background:#111514;color:#f1eee6;font:16px/1.65 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px}h1{font:normal 36px Georgia,serif}a{color:#e5c689}fieldset{border:1px solid #56574c;border-radius:12px;padding:18px}label{display:block;margin:10px 0}input,select,button{padding:10px;border-radius:8px;font:inherit}button{background:#e5c689;border:0;cursor:pointer}#chapter{white-space:pre-wrap;font:19px/1.9 Georgia,serif;margin:25px 0}#status{color:#e5c689}input{max-width:120px}</style>
</head><body><main><a href="./">← Volver a mi cuenta</a><h1>Lectura protegida</h1>
<p>Versión de desarrollo. Solo se mostrarán capítulos cuyos derechos de distribución comercial estén verificados y que se hayan cargado en el repositorio privado.</p>
<fieldset><legend>Buscar capítulo</legend>
<label>Idioma <select id="language"><option value="es">Español</option><option value="en">Inglés</option><option value="pt">Portugués</option><option value="it">Italiano</option></select></label>
<label>Código del libro (catálogo autorizado) <input id="book" placeholder="GEN" maxlength="12" autocomplete="off"></label>
<label>Capítulo <input id="chapterNumber" type="number" min="1" max="200" value="1"></label>
<button id="read">Leer capítulo</button></fieldset>
<p id="status" role="status" aria-live="polite">Comprobando sesión…</p><article id="chapter" aria-label="Texto bíblico"></article>
<button id="logout">Cerrar sesión</button></main>
<script src="./config.js"></script>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const cfg=window.TBD_CONFIG,$=id=>document.getElementById(id);
if(!cfg?.supabaseUrl||!cfg?.supabaseAnonKey||!cfg?.functionsUrl){$("status").textContent="Configuración pendiente.";}
else{
const sb=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
async function session(){const {data:{user}}=await sb.auth.getUser();if(!user)throw Error("Inicia sesión antes de leer.");const {data,error}=await sb.from("entitlements").select("user_id").eq("user_id",user.id).maybeSingle();if(error)throw error;if(!data)throw Error("Tu cuenta todavía no tiene acceso.");const {data:{session}}=await sb.auth.getSession();if(!session)throw Error("La sesión ha caducado.");return session;}
$("read").addEventListener("click",async()=>{const button=$("read");button.disabled=true;$("chapter").textContent="";$("status").textContent="Verificando acceso…";try{const token=await session();const response=await fetch(cfg.functionsUrl+"/read-licensed-chapter",{method:"POST",headers:{"Content-Type":"application/json","apikey":cfg.supabaseAnonKey,"Authorization":"Bearer "+token.access_token},body:JSON.stringify({book:$("book").value.trim().toUpperCase(),chapter:Number($("chapterNumber").value),language:$("language").value})});const data=await response.json();if(!response.ok)throw Error(data.error||"No se pudo abrir el capítulo");$("chapter").textContent=data.text;$("status").textContent="Capítulo cargado."; }catch(e){$("status").textContent=e.message;}finally{button.disabled=false;}});
$("logout").addEventListener("click",async()=>{await sb.auth.signOut();location.assign("./");});
session().then(()=>$("status").textContent="Licencia verificada. Elige un capítulo.").catch(e=>$("status").textContent=e.message);
}
</script></body></html>
